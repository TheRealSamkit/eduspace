{% extends "base.html" %}

{% block title %}500 - Server Error - StudyExchange{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="card p-4 p-md-5">
            <div class="mb-3">
                <i class="ti ti-server-off fs-1 text-danger" aria-hidden="true"></i>
            </div>
            <h1 class="h3 fw-bold text-body mb-3">Internal Server Error</h1>
            <p class="text-body-secondary mb-4 mx-auto" style="max-width: 480px;">
                An unexpected technical glitch occurred. Our administrators have logged the error telemetry for investigation.
            </p>
            <div>
                <a href="{{ url_for('browse') if current_user else url_for('index') }}" class="btn btn-primary px-4 fw-medium">
                    <i class="ti ti-home me-1" aria-hidden="true"></i>Return to Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
