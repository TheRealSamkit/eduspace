{% extends "base.html" %}

{% block title %}Sign In - StudyExchange{% endblock %}

{% block content_guest %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header text-center py-3">
                <span class="fw-semibold text-body">Sign In</span>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="needs-validation" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium text-body">Institutional Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="student@xyz.edu" required autofocus>
                        <div class="invalid-feedback">Please enter your university email.</div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium text-body">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="••••••••" required>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-body-secondary small mb-0">
                        Need an account? <a href="{{ url_for('register') }}" class="text-decoration-none">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
